name: pantry
description: >-
  Pantry, fil rouge du cours Flutter M2. Gestion de garde-manger :
  identification d'un produit, suivi du stock et des dates de péremption,
  liste de courses.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Les paquets s'ajoutent au fil des séances, quand le code en a besoin, par la
# commande que donne le TP.md de la séance :
#
#   flutter pub add go_router:18.0.0
#
# La version est imposée. Le pubspec.lock est committé : il fixe aussi les
# versions des paquets que chacun tire avec lui. Ne pas lancer
# `flutter pub upgrade`, ne pas ajouter de dependency_overrides : la chaîne de
# génération de code (build_runner, freezed, drift_dev, injectable) n'accepte
# qu'une plage étroite de versions.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  go_router: 18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
