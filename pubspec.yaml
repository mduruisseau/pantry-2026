name: pantry
description: >-
  Pantry, fil rouge du cours Flutter M2. Gestion de garde-manger :
  identification d'un produit, suivi du stock et des dates de péremption,
  liste de courses.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Ce fichier est IDENTIQUE sur toutes les branches de séance, et le
# pubspec.lock est committé. Deux raisons :
#
#  1. Changer de branche ne déclenche alors aucun téléchargement. Un premier
#     `flutter pub get` remplit ~330 Mo de cache ; le refaire à chaque séance
#     coûterait un quart d'heure de cours et saturerait le réseau de la salle.
#  2. Les versions sont figées pour l'année. La chaîne de génération de code
#     (build_runner, freezed, drift_dev, injectable) n'accepte qu'une plage
#     étroite d'`analyzer` : la laisser flotter casse le projet en cours de
#     semestre.
#
# Ne pas lancer `flutter pub upgrade`. Ne pas ajouter de dependency_overrides.
#
# Les paquets sont annotés par la séance qui les introduit. Ils sont présents
# dès maintenant pour la raison n°1 ; ne pas s'en servir avant.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9

  # Séance 3 · navigation
  go_router: 18.0.0

  # Séance 4 · réseau et modèles
  dio: 5.11.0
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # Séance 5 · gestion d'état
  flutter_bloc: 9.1.1
  bloc_concurrency: 0.3.0

  # Séance 6 · injection de dépendances
  get_it: 9.2.1
  injectable: 3.0.0

  # Séance 7 · persistance
  drift: 2.34.3
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  connectivity_plus: 7.3.1

  # Séance 8 · capacités natives
  mobile_scanner: 7.4.0
  flutter_local_notifications: 22.3.0

  # Séance 9 · internationalisation
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Séance 4 · génération de code
  build_runner: 2.16.0
  freezed: 4.0.0
  json_serializable: 6.14.1

  # Séances 6 et 7
  injectable_generator: 3.1.3
  drift_dev: 2.34.5

  # Séance 10 · tests
  bloc_test: 10.0.0
  mocktail: 1.0.5

  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
